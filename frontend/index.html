<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regrowth OS — Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            padding: 1rem;
        }
        .auth-card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .auth-logo {
            font-size: 2rem;
            margin-bottom: 0.25rem;
        }
        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            color: white;
        }
        .auth-subtitle {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 0.25rem;
        }
        .auth-body {
            padding: 2rem;
        }
        .tabs {
            display: flex;
            background: #F3F4F6;
            border-radius: 0.75rem;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        .tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 0.6rem;
            transition: all 0.2s;
            color: #6B7280;
            border: none;
            background: transparent;
        }
        .tab.active {
            background: white;
            color: #4F46E5;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .disclaimer {
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 0.8rem;
            color: #92400E;
            margin-top: 1rem;
            line-height: 1.5;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #E5E7EB;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
            background: white;
            box-sizing: border-box;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .form-label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        .form-group { margin-bottom: 1.1rem; }
        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            color: white;
            border: none;
            border-radius: 0.6rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .error-message {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .success-message {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #6EE7B7;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .age-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .age-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4F46E5;
        }
        .age-check label {
            font-size: 0.85rem;
            color: #374151;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">💊</div>
                <h1 class="auth-title">Regrowth OS</h1>
                <p class="auth-subtitle">Man Matters Hair Treatment Tracker</p>
            </div>
            <div class="auth-body">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('login')">Login</button>
                    <button class="tab" onclick="switchTab('register')">Sign Up</button>
                </div>

                <!-- Login Form -->
                <div id="login-tab" class="tab-content active">
                    <div id="login-error" class="error-message"></div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    </div>
                    <button class="btn-primary" onclick="handleLogin()" id="login-btn">
                        Login to Dashboard
                    </button>
                </div>

                <!-- Register Form -->
                <div id="register-tab" class="tab-content">
                    <div id="register-error" class="error-message"></div>
                    <div id="register-success" class="success-message"></div>
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password (min 6 characters)</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Treatment Start Date</label>
                        <input type="date" id="reg-start-date" class="form-input">
                        <small style="color:#6B7280; font-size:0.8rem;">Leave blank to set today as Day 1</small>
                    </div>
                    <div class="form-group">
                        <label class="form-label">How often do you apply?</label>
                        <select id="reg-frequency" class="form-select">
                            <option value="2">Twice daily (Morning + Night) — Recommended</option>
                            <option value="1">Once daily (Night only)</option>
                        </select>
                    </div>
                    <div class="age-check">
                        <input type="checkbox" id="age-confirm">
                        <label for="age-confirm">I confirm I am 18 years or older</label>
                    </div>
                    <button class="btn-primary" onclick="handleRegister()" id="register-btn" style="margin-top: 1rem;">
                        Create Account
                    </button>
                    <div class="disclaimer">
                        ⚠️ This app helps you track your existing hair care routine. It does NOT prescribe medication or replace professional medical advice. Always consult a dermatologist if needed.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // If already logged in, go to dashboard
        if (localStorage.getItem('token')) {
            window.location.href = '/pages/dashboard.html';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        async function handleLogin() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');

            if (!email || !password) {
                showError(errorDiv, 'Please enter both email and password.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>Logging in...';
            errorDiv.style.display = 'none';

            try {
                const result = await loginUser(email, password);
                localStorage.setItem('token', result.access_token);
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = 'pages/dashboard.html';
            } catch (err) {
                showError(errorDiv, err.message || 'Login failed. Check your credentials.');
                btn.disabled = false;
                btn.innerHTML = 'Login to Dashboard';
            }
        }

        async function handleRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const startDate = document.getElementById('reg-start-date').value;
            const frequency = parseInt(document.getElementById('reg-frequency').value);
            const ageConfirm = document.getElementById('age-confirm').checked;
            const btn = document.getElementById('register-btn');
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');

            if (!name || !email || !password) {
                showError(errorDiv, 'Please fill in all required fields.');
                return;
            }
            if (password.length < 6) {
                showError(errorDiv, 'Password must be at least 6 characters.');
                return;
            }
            if (!ageConfirm) {
                showError(errorDiv, 'Please confirm you are 18 or older to continue.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>Creating account...';
            errorDiv.style.display = 'none';

            try {
                const payload = { name, email, password, dosage_frequency: frequency };
                if (startDate) payload.treatment_start_date = startDate;

                const result = await registerUser(payload);
                localStorage.setItem('token', result.access_token);
                localStorage.setItem('user', JSON.stringify(result.user));
                successDiv.textContent = 'Account created! Redirecting to dashboard...';
                successDiv.style.display = 'block';
                setTimeout(() => { window.location.href = 'pages/dashboard.html'; }, 1500);
            } catch (err) {
                showError(errorDiv, err.message || 'Registration failed. Try again.');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }

        function showError(el, msg) {
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
